[project]
name = "bank-feature-store"
version = "0.1.0"
description = "Feature store pour l'analyse prédictive bancaire"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.50",
    "fastapi>=0.110",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]
