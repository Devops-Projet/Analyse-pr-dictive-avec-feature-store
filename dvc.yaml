stages:
  generate:
    cmd: python -m pipelines.generate_data
    deps:
      - pipelines/generate_data.py
    params:
      - seed
      - data
    outs:
      - data/raw

  validate:
    cmd: python -m pipelines.validate_data
    deps:
      - pipelines/validate_data.py
      - data/raw
    params:
      - data.date_reference
    outs:
      - data/interim/validation_report.json

  build_features:
    cmd: python -m pipelines.build_features
    deps:
      - pipelines/build_features.py
      - feature_store/registry.py
      - feature_store/transformations.py
      - data/raw
      - data/interim/validation_report.json
    params:
      - features
    outs:
      - data/features/features.csv

  # Relancée à chaque "dvc repro" : la base PostgreSQL n'est pas suivie par DVC,
  # elle doit être rechargée même si le fichier de variables n'a pas changé.
  load_features:
    cmd: python -m pipelines.load_features
    always_changed: true
    deps:
      - pipelines/load_features.py
      - feature_store/schema.sql
      - feature_store/materialize.py
      - data/features/features.csv
    outs:
      - data/features/load_receipt.json:
          cache: false

  drift:
    cmd: python -m monitoring.drift
    deps:
      - monitoring/drift.py
      - data/features/features.csv
    params:
      - monitoring
    metrics:
      - reports/drift.json:
          cache: false

  # Les modèles lisent leurs variables dans PostgreSQL : le reçu de chargement
  # représente l'état du store dont ils dépendent.
  train_scoring:
    cmd: python -m models.credit_scoring.train
    deps:
      - models/common
      - models/credit_scoring/train.py
      - data/features/load_receipt.json
      - data/raw/clients.csv
    params:
      - seed
      - models.label_date
      - models.test_size
      - models.scoring
    outs:
      - models/credit_scoring/last_run.json:
          cache: false

  train_marketing:
    cmd: python -m models.marketing_propensity.train
    deps:
      - models/common
      - models/marketing_propensity/train.py
      - data/features/load_receipt.json
      - data/raw/clients.csv
    params:
      - seed
      - models.label_date
      - models.test_size
      - models.marketing
    outs:
      - models/marketing_propensity/last_run.json:
          cache: false

  evaluate:
    cmd: >-
      python -m models.credit_scoring.evaluate
      && python -m models.marketing_propensity.evaluate
    deps:
      - models/credit_scoring/evaluate.py
      - models/marketing_propensity/evaluate.py
      - models/credit_scoring/last_run.json
      - models/marketing_propensity/last_run.json
    params:
      - models.scoring.min_auc
      - models.marketing.min_auc
    metrics:
      - reports/credit_scoring.json:
          cache: false
      - reports/marketing_propensity.json:
          cache: false
