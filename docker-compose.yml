name: bank-feature-store

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: bank-feature-store-pipeline
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "*"
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "${MLFLOW_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: bank-feature-store-api
    env_file: .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # Service ponctuel, lancé par "make pipeline" : pas de healthcheck.
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: bank-feature-store-pipeline
    profiles: ["pipeline"]
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_artifacts:
